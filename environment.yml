name: msinet
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pytorch-cuda=11.7
  - numpy=1.22
  - pillow=9.2
  - pyyaml=6.0
  - opencv=4.6
  - lmdb=1.4
  - scipy=1.9
  - matplotlib=3.6
  - tqdm=4.64
  - tensorboard=2.11
  - pip
  - pip:
      - timm==0.3.2
      - easydict>=1.9
      - imgaug==0.4.0
      - editdistance>=0.6
      - lpips==0.1.4
      - ptflops>=0.6
      - seaborn>=0.11
      - six>=1.15
      - ipython>=7.0
      - pytest>=7.0
