# Public MSINet-S configuration. Paths are repository-relative and must be
# populated by the user; no dataset or checkpoint is distributed in Git.
MODEL: {}

TRAIN:
  pretrained_trans: "weights/pretrain_transformer.pth"
  train_data_dir:
    - "data/TextZoom/train1"
    - "data/TextZoom/train2"
  # Recovered final-checkpoint metadata records batch size 16. The paper
  # reports batch size 64; see README for the distinction.
  batch_size: 16
  width: 128
  height: 32
  epochs: 500
  cuda: true
  ngpu: 1
  workers: 4
  resume: ""
  ckpt_dir: "outputs"
  voc_type: "all"
  saveInterval: 200
  displayInterval: 50
  log_freq: 50
  vis_freq: 200
  adadelta: false
  # Historical main parameter group; MAE/base-SR groups use --lr_position 1e-5.
  lr: 1.0e-3
  adam: true
  optimizer: "AdamW"
  beta1: 0.5
  manualSeed: 1234
  max_len: 100
  keep_ratio: false
  down_sample_scale: 2
  VAL:
    val_data_dir:
      - "data/TextZoom/test/easy"
      - "data/TextZoom/test/medium"
      - "data/TextZoom/test/hard"
    n_vis: 10
    vis_dir: "msinet_small"
    valInterval: 400
    rec_pretrained: "weights/recognizers/aster.pth.tar"
    moran_pretrained: "weights/recognizers/moran.pth"
    crnn_pretrained: "weights/recognizers/crnn.pth"

TEST:
  width: 128
  height: 32
  ngpu: 1
  down_sample_scale: 2
  checkpoint: ""
  test_data_dir: []

CONVERT:
  image_dir: null
  lmdb_dir: null
  n_convert: 10

PositionAware:
  dataset_max_length: 25
  dataset_charset_path: "dataset/charset_36.txt"
  model_vision_attention_mode: "nearest"
  vision:
    checkpoint: "weights/abinet/pretrain-vision-model.pth"
    loss_weight: 1.0
    attention: "position"
    backbone: "transformer"
    backbone_ln: 3
    d_model: 512
  language:
    checkpoint: "weights/abinet/pretrain-language-model.pth"
    num_layers: 4
    loss_weight: 1.0
    detach: true
    use_self_attn: false

MaskRefine:
  srb_nums: 3
  mae_vit:
    type: "small"
    checkpoint: "weights/mae/vit_small_checkpoint-19.pth"

Pretrain_SR_Model:
  name: "BICUBIC"
  checkpoint: ""

ABINet: &abinet
  dataset_max_length: 25
  dataset_charset_path: "dataset/charset_36.txt"
  model_vision_attention_mode: "nearest"
  full_ckpt: "weights/abinet/best-train-abinet.pth"
  vision:
    checkpoint: "weights/abinet/pretrain-vision-model.pth"
    loss_weight: 1.0
    attention: "position"
    backbone: "transformer"
    backbone_ln: 3
    d_model: 512
  language:
    checkpoint: "weights/abinet/pretrain-language-model.pth"
    num_layers: 4
    loss_weight: 1.0
    detach: true
    use_self_attn: false

ConfidenceMapGenerator:
  <<: *abinet

MATRN:
  dataset_charset_path: "dataset/charset_36.txt"
  dataset_max_length: 25
  model_vision_attention_mode: "nearest"
  full_ckpt: "weights/recognizers/matrn.pth"
  vision:
    checkpoint: null
    attention: "position"
    backbone: "transformer"
    backbone_ln: 3
    d_model: 512
  language:
    checkpoint: null
    num_layers: 4
    detach: true
    use_self_attn: false

PARSeq:
  full_ckpt: "weights/recognizers/parseq.pt"
  img_size: [32, 128]
  patch_size: [4, 8]
  embed_dim: 384
  enc_depth: 12
  enc_num_heads: 6
  enc_mlp_ratio: 4
  max_label_length: 25
  decode_ar: true
  refine_iters: 1
  dec_num_heads: 12
  dec_mlp_ratio: 4
  dropout: 0.1
  dec_depth: 1
  perm_num: 6
  perm_mirrored: true
